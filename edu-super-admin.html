
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduOps — Workforce & Class Operations</title>
<style>
/* ===== SKY-BLUE PALETTE ===== */
:root {
  --bg: #F0F5FA;
  --bg-sky: linear-gradient(180deg, #E8F0FB 0%, #F4F8FD 40%, #FAFCFF 100%);
  --surface: #FFFFFF;
  --fg: #1A2B42;
  --fg-secondary: #4A5E78;
  --muted: #8A9BB5;
  --border: #DDE6F0;
  --accent: #4DA3FF;
  --accent-hover: #3B8FEF;
  --accent-light: #EBF4FF;
  --accent-lighter: #F5FAFF;
  --cloud-1: #E1EEFB;
  --cloud-2: #D0E4F7;
  --sun: #FFF4D6;
  --sun-accent: #FFD466;
  --success: #22C55E;
  --success-light: #ECFDF5;
  --warn: #F59E0B;
  --warn-light: #FFFBEB;
  --danger: #EF4444;
  --danger-light: #FEF2F2;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(26,43,66,0.06), 0 4px 12px rgba(26,43,66,0.04);
  --shadow-lg: 0 4px 16px rgba(26,43,66,0.08), 0 12px 32px rgba(26,43,66,0.04);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --sidebar-w: 260px;
  --topbar-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font); color: var(--fg); background: var(--bg); background-image: var(--bg-sky); min-height: 100vh; line-height: 1.6; }
a { color: var(--accent); text-decoration: none; }
button { font-family: var(--font); cursor: pointer; border: none; font-size: 0.9rem; }
input, select, textarea { font-family: var(--font); font-size: 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 10px 14px; outline: none; transition: var(--transition); background: var(--surface); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77,163,255,0.15); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--border); }
td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
tr:hover td { background: var(--accent-lighter); }
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
.badge-success { background: var(--success-light); color: #15803D; }
.badge-warn { background: var(--warn-light); color: #B45309; }
.badge-danger { background: var(--danger-light); color: #DC2626; }
.badge-info { background: var(--accent-light); color: #2563EB; }
.badge-muted { background: #F1F5F9; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; transition: var(--transition); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(77,163,255,0.3); }
.btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: var(--danger-light); color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-icon { width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: transparent; color: var(--muted); }
.btn-icon:hover { background: var(--accent-light); color: var(--accent); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; border: 1px solid rgba(221,230,240,0.5); transition: var(--transition); }
.card:hover { box-shadow: var(--shadow-lg); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card-title { font-size: 1rem; font-weight: 600; }

/* ===== LAYOUT ===== */
.app-layout { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: var(--transition); }
.sidebar-logo { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.sidebar-logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #7BC4FF); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.1rem; }
.sidebar-logo h1 { font-size: 1.05rem; font-weight: 700; color: var(--fg); }
.sidebar-logo small { font-size: 0.7rem; color: var(--muted); display: block; margin-top: -2px; }
.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
.sidebar-section { margin-bottom: 8px; }
.sidebar-section-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 12px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--fg-secondary); cursor: pointer; transition: var(--transition); font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; }
.nav-item:hover { background: var(--accent-light); color: var(--accent); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.nav-item .nav-icon { width: 20px; text-align: center; font-size: 1rem; }
.nav-item .nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 0.65rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.sidebar-user { padding: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sidebar-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #7BC4FF); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.8rem; }
.sidebar-user-info { flex: 1; }
.sidebar-user-name { font-size: 0.85rem; font-weight: 600; }
.sidebar-user-role { font-size: 0.7rem; color: var(--muted); }

/* TOPBAR */
.topbar { height: var(--topbar-h); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px; position: fixed; top: 0; left: var(--sidebar-w); right: 0; z-index: 90; }
.topbar-search { flex: 1; max-width: 400px; position: relative; }
.topbar-search input { width: 100%; padding: 9px 14px 9px 38px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid transparent; }
.topbar-search input:focus { background: var(--surface); border-color: var(--accent); }
.topbar-search .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.topbar-notif { position: relative; }
.topbar-notif .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid #fff; }
.topbar-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #FFB347, #FFCC80); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
.role-switcher { display: flex; align-items: center; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-right: 16px; }
.role-switcher button { padding: 6px 12px; border-radius: var(--radius-xs); font-size: 0.75rem; font-weight: 600; color: var(--muted); background: transparent; transition: var(--transition); }
.role-switcher button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

/* MAIN CONTENT */
.main-content { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); flex: 1; padding: 28px 32px; min-height: calc(100vh - var(--topbar-h)); }
.page-header { margin-bottom: 28px; }
.page-header h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
.page-header p { color: var(--muted); font-size: 0.9rem; }
.page-header-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }

/* STAT CARDS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow); border: 1px solid rgba(221,230,240,0.5); transition: var(--transition); position: relative; overflow: hidden; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat-card::after { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; opacity: 0.08; }
.stat-card.accent::after { background: var(--accent); }
.stat-card.success::after { background: var(--success); }
.stat-card.warn::after { background: var(--warn); }
.stat-card.danger::after { background: var(--danger); }
.stat-card .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; margin-bottom: 12px; }
.stat-card .stat-icon.accent { background: var(--accent-light); color: var(--accent); }
.stat-card .stat-icon.success { background: var(--success-light); color: var(--success); }
.stat-card .stat-icon.warn { background: var(--warn-light); color: var(--warn); }
.stat-card .stat-icon.danger { background: var(--danger-light); color: var(--danger); }
.stat-card .stat-value { font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
.stat-card .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.stat-card .stat-change { font-size: 0.75rem; margin-top: 6px; font-weight: 600; }
.stat-card .stat-change.up { color: var(--success); }
.stat-card .stat-change.down { color: var(--danger); }

/* GRID LAYOUTS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 28px; }

/* CHART PLACEHOLDER */
.chart-area { width: 100%; height: 240px; border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.chart-area .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 100%; padding: 20px 0 28px; }
.chart-area .chart-bar { flex: 1; border-radius: 4px 4px 0 0; transition: all 0.6s cubic-bezier(0.4,0,0.2,1); min-height: 8px; position: relative; }
.chart-area .chart-bar:hover { opacity: 0.85; }
.chart-area .chart-labels { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; font-size: 0.65rem; color: var(--muted); padding: 0 4px; }
.chart-line { width: 100%; height: 200px; position: relative; }
.chart-line svg { width: 100%; height: 100%; }

/* TABLE CARD */
.table-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(221,230,240,0.5); overflow: hidden; margin-bottom: 24px; }
.table-card-header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.table-card-header h3 { font-size: 1rem; font-weight: 600; }
.table-card table th { background: var(--bg); }
.table-actions { display: flex; gap: 6px; }

/* TABS */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tab { padding: 12px 20px; font-size: 0.9rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); }
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* TIMELINE */
.timeline-item { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.timeline-item:last-child { border-bottom: none; }
.timeline-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.timeline-content { flex: 1; }
.timeline-content h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
.timeline-content p { font-size: 0.8rem; color: var(--muted); }
.timeline-time { font-size: 0.75rem; color: var(--muted); font-weight: 500; white-space: nowrap; }

/* ALERTS */
.alert-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 0.85rem; transition: var(--transition); }
.alert-item:hover { transform: translateX(4px); }
.alert-item.alert-late { background: var(--danger-light); color: #991B1B; }
.alert-item.alert-warn { background: var(--warn-light); color: #92400E; }
.alert-item.alert-info { background: var(--accent-light); color: #1E40AF; }
.alert-item .alert-icon { font-size: 1rem; }

/* CALENDAR GRID */
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.cal-nav { display: flex; align-items: center; gap: 12px; }
.cal-nav h3 { font-size: 1.1rem; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border-radius: var(--radius); overflow: hidden; }
.cal-day-header { background: var(--bg); padding: 10px; text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.cal-day { background: var(--surface); padding: 8px; min-height: 100px; position: relative; }
.cal-day .day-num { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
.cal-day.today .day-num { background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.cal-day.other-month { opacity: 0.4; }
.cal-event { padding: 3px 6px; border-radius: 4px; font-size: 0.65rem; margin-bottom: 2px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.cal-event.class-a { background: var(--accent-light); color: #2563EB; }
.cal-event.class-b { background: var(--success-light); color: #15803D; }
.cal-event.class-c { background: var(--sun); color: #92400E; }
.cal-event.class-d { background: #F3E8FF; color: #7C3AED; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(26,43,66,0.4); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: var(--transition); }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; transform: translateY(20px) scale(0.97); transition: var(--transition); }
.modal-overlay.show .modal { transform: translateY(0) scale(1); }
.modal-header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 1.15rem; font-weight: 700; }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 0 24px 24px; display: flex; justify-content: flex-end; gap: 10px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--fg-secondary); }
.form-group input, .form-group select, .form-group textarea { width: 100%; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* PROGRESS BAR */
.progress { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }

/* AVATAR */
.avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; color: #fff; flex-shrink: 0; }

/* SESSION CARD */
.session-card { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 10px; transition: var(--transition); cursor: pointer; }
.session-card:hover { border-color: var(--accent); background: var(--accent-lighter); }
.session-time { font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 50px; }
.session-info { flex: 1; }
.session-info h4 { font-size: 0.9rem; font-weight: 600; }
.session-info p { font-size: 0.8rem; color: var(--muted); }
.session-status { font-size: 0.75rem; }

/* QUICK ACTIONS GRID */
.quick-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.quick-action { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); transition: var(--transition); cursor: pointer; text-align: center; }
.quick-action:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.quick-action .qa-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.quick-action .qa-label { font-size: 0.8rem; font-weight: 600; }

/* TEACHER CARD */
.teacher-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); transition: var(--transition); cursor: pointer; }
.teacher-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.teacher-info { flex: 1; }
.teacher-info h4 { font-size: 0.9rem; font-weight: 600; }
.teacher-info p { font-size: 0.8rem; color: var(--muted); }
.teacher-stats { display: flex; gap: 16px; }
.teacher-stat { text-align: center; }
.teacher-stat .t-val { font-size: 1rem; font-weight: 700; }
.teacher-stat .t-lbl { font-size: 0.65rem; color: var(--muted); }

/* SCHOOL CARD */
.school-card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); transition: var(--transition); cursor: pointer; }
.school-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-2px); }
.school-card h4 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
.school-card .school-addr { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
.school-card .school-meta { display: flex; gap: 16px; font-size: 0.8rem; }
.school-card .school-meta span { color: var(--fg-secondary); }

/* NOTIFICATION ITEM */
.notif-item { display: flex; gap: 14px; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 8px; transition: var(--transition); cursor: pointer; }
.notif-item:hover { background: var(--accent-lighter); }
.notif-item.unread { background: var(--accent-light); }
.notif-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.notif-content { flex: 1; }
.notif-content h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
.notif-content p { font-size: 0.8rem; color: var(--muted); }
.notif-time { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }

/* MOBILE APP */
.mobile-app { display: none; }
.mobile-phone { width: 390px; height: 844px; margin: 0 auto; background: var(--surface); border-radius: 40px; box-shadow: var(--shadow-lg); overflow: hidden; border: 8px solid #1A2B42; position: relative; }
.mobile-statusbar { height: 52px; background: var(--surface); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 6px; font-size: 0.8rem; font-weight: 600; }
.mobile-header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
.mobile-header h2 { font-size: 1.2rem; font-weight: 700; }
.mobile-body { padding: 0 20px; overflow-y: auto; height: calc(100% - 52px - 52px - 72px); }
.mobile-tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; }
.mobile-tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.6rem; font-weight: 600; color: var(--muted); cursor: pointer; padding: 4px 8px; }
.mobile-tab-item.active { color: var(--accent); }
.mobile-tab-item .mt-icon { font-size: 1.1rem; }

/* CHECKIN BUTTON */
.checkin-btn { width: 100%; padding: 20px; border-radius: var(--radius); font-size: 1.2rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), #7BC4FF); border: none; transition: var(--transition); cursor: pointer; }
.checkin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(77,163,255,0.3); }
.checkin-btn.checkout { background: linear-gradient(135deg, #FF8A65, #FFB74D); }
.checkin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* GPS INDICATOR */
.gps-status { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; margin-bottom: 16px; }
.gps-status.valid { background: var(--success-light); color: #15803D; }
.gps-status.invalid { background: var(--danger-light); color: #991B1B; }

/* PAGES VISIBILITY */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* CLOUD DECORATION */

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-switcher button').forEach(b => b.classList.remove('active'));
  document.getElementById('roleBtn-' + role).classList.add('active');
  if (role === 'teacher') {
    document.getElementById('appLayout').style.display = 'none';
    document.getElementById('mobileApp').style.display = 'block';
    renderMobileApp();
    return;
  }
  document.getElementById('appLayout').style.display = 'flex';
  document.getElementById('mobileApp').style.display = 'none';
  const cfg = ROLES[role];
  document.getElementById('userName').textContent = cfg.userName;
  document.getElementById('userRole').textContent = cfg.userRole;
  document.getElementById('userAvatar').textContent = cfg.avatar;
  document.getElementById('userAvatar').style.background = cfg.avatarBg;
  renderSidebar(cfg.nav);
  navigateTo(cfg.nav.find(n => !n.section)?.id || 'dashboard');
}

function renderSidebar(nav) {
  const el = document.getElementById('sidebarNav');
  el.innerHTML = nav.map(item => {
    if (item.section) return `<div class="sidebar-section"><div class="sidebar-section-label">${item.section}</div></div>`;
    return `<div class="nav-item ${item.id === currentPage ? 'active' : ''}" onclick="navigateTo('${item.id}')" data-nav="${item.id}">
      <span class="nav-icon">${item.icon}</span>
      <span>${item.label}</span>
      ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
    </div>`;
  }).join('');
}

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.nav === page));
  const renderer = PAGES[page];
  if (renderer) {
    document.getElementById('mainContent').innerHTML = renderer();
    if (typeof afterRender === 'function') afterRender(page);
  }
}

  </div>
  <div class="cal-grid">
    ${['T2','T3','T4','T5','T6','T7','CN'].map(d => `<div class="cal-day-header">${d}</div>`).join('')}
    ${generateCalendarDays()}
  </div>

function generateCalendarDays() {
  let days = '';
  for (let i = 0; i < 35; i++) {
    const day = i - 2;
    const isOther = day < 1 || day > 30;
    const isToday = day === 12;
    const events = getCalEvents(day);
    days += `<div class="cal-day ${isOther?'other-month':''} ${isToday?'today':''}">
      <div class="day-num">${isOther?(day<1?31+day:day-30):day}</div>
      ${events}
    </div>`;
  }
  return days;
}
function getCalEvents(day) {
  const evts = {3:['class-a Lớp 8/2 07:30','class-b Lớp 3A 09:00'],5:['class-a Lớp 8/2 07:30','class-c Lớp 10A1 13:30'],6:['class-b Lớp Lá A 15:00','class-d Lớp 7/1 17:30'],10:['class-a Lớp 8/2 07:30'],12:['class-a Lớp 8/2 07:30','class-b Lớp 3A 09:00','class-c Lớp 10A1 13:30'],17:['class-a Lớp 8/2 07:30','class-d Lớp 9/3 18:00'],19:['class-b Lớp Lá A 15:00'],24:['class-a Lớp 8/2 07:30','class-c Lớp 10A1 13:30'],26:['class-b Lớp 3A 09:00'],28:['class-d Lớp 7/1 17:30']};
  return (evts[day]||[]).map(e => `<div class="cal-event ${e.split(' ')[0]}">${e.split(' ').slice(1).join(' ')}</div>`).join('');
}

// ===== CHART RENDERING =====
function afterRender(page) {
  if (page === 'dashboard') {
    const chartEl = document.getElementById('chartUsage');
    if (chartEl) { const data = [65,72,80,78,88,95]; const max = Math.max(...data); chartEl.innerHTML = data.map((d,i) => `<div class="chart-bar" style="height:0%;background:linear-gradient(180deg,var(--accent),#7BC4FF);opacity:${0.5+i*0.1}"></div>`).join(''); setTimeout(() => { chartEl.querySelectorAll('.chart-bar').forEach((b,i) => b.style.height = (data[i]/max*85+10)+'%'); }, 50); }
  }
  if (page === 'analytics') {
    const el = document.getElementById('chartDaily');
    if (el) { const data = [42,38,45,41,44,32,8]; const max = Math.max(...data); el.innerHTML = data.map((d,i) => `<div class="chart-bar" style="height:0%;background:linear-gradient(180deg,var(--accent),#7BC4FF);opacity:${0.5+i*0.08}"></div>`).join(''); setTimeout(() => { el.querySelectorAll('.chart-bar').forEach((b,i) => b.style.height = (data[i]/max*80+10)+'%'); }, 50); }
  }
  if (page === 'c-analytics') {
    const el = document.getElementById('chartWeekly');
    if (el) { const data = [28,32,30,35,28,22]; const max = Math.max(...data); el.innerHTML = data.map((d,i) => `<div class="chart-bar" style="height:0%;background:linear-gradient(180deg,var(--accent),#7BC4FF);opacity:${0.5+i*0.1}"></div>`).join(''); setTimeout(() => { el.querySelectorAll('.chart-bar').forEach((b,i) => b.style.height = (data[i]/max*80+10)+'%'); }, 50); }
  }
}
