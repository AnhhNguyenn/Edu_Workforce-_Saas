events {
    worker_connections 1024;
}

http {
    # Định nghĩa Zone cho Rate Limiting
    # limit_req_zone key zone=name:size rate=rate;
    
    # 1. Global Rate Limit: 100 requests / 1 minute.
    # Dùng binary_remote_addr để tiết kiệm bộ nhớ khi lưu IP.
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/m;
    
    # 2. Auth Rate Limit: 5 requests / 1 minute (Chống Brute-force mật khẩu).
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    
    # 3. Strict Rate Limit: 2 requests / 1 minute (Chống spam Mua gói, Thanh toán, Upload file).
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=2r/m;
    
    # Trả về mã lỗi 429 (Too Many Requests) khi bị Rate Limit chặn
    limit_req_status 429;

    server {
        listen 80;

        # ==========================================
        # Cấu hình Route cho Backend API
        # ==========================================

        # Endpoint Đăng nhập / Xác thực (Áp dụng Auth Limit)
        location /api/auth/ {
            # burst=2: Cho phép dồn tối đa 2 request cùng lúc vượt mức 5r/m. nodelay: Xử lý ngay lập tức.
            limit_req zone=auth_limit burst=2 nodelay;

            proxy_pass http://backendeduopssaas:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==========================================
        # Nhóm Endpoint Nhạy Cảm (Áp dụng Strict Limit)
        # ==========================================
        # Đăng ký gói / Giao dịch
        location /api/Subscriptions/ {
            limit_req zone=strict_limit burst=1 nodelay;
            proxy_pass http://backendeduopssaas:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Webhook Thanh toán (SePay)
        location /api/sepay/ {
            limit_req zone=strict_limit burst=2 nodelay;
            proxy_pass http://backendeduopssaas:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Upload File (Chống spam rác dung lượng ổ cứng)
        location /api/uploads/ {
            limit_req zone=strict_limit burst=2 nodelay;
            proxy_pass http://backendeduopssaas:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Các Endpoint API còn lại (Áp dụng Global Limit)
        location /api/ {
            limit_req zone=global_limit burst=20 nodelay;

            proxy_pass http://backendeduopssaas:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Bỏ qua Rate Limit cho Websocket / SignalR (Realtime Hub)
        location /hub/ {
            proxy_pass http://backendeduopssaas:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # ==========================================
        # Cấu hình Route cho Frontend (Next.js)
        # ==========================================
        location / {
            proxy_pass http://frontendeduopssaas:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Cấu hình Websocket để hỗ trợ HMR (Hot Reload) của Next.js trong môi trường Dev
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
